name: care_connect
description: CareConnect - Child Care Communication & Safety Monitoring
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.19
  flutter_local_notifications: ^17.2.4

  # State Management
  provider: ^6.1.2

  # Offline Storage (SQLite)
  sqflite: ^2.3.2
  path: ^1.9.0

  # Image Handling
  image_picker: ^1.0.7

  # UI & Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  cached_network_image: ^3.3.1
  table_calendar: ^3.1.3
  geolocator: ^12.0.0
  google_maps_flutter: ^2.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
